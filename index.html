  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--pitch-dark);
    background-image:
      radial-gradient(circle at 50% -10%, rgba(220,183,82,0.10), transparent 45%),
      repeating-linear-gradient(135deg, rgba(220,183,82,0.03) 0px, rgba(220,183,82,0.03) 1px, transparent 1px, transparent 26px);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }

  .display{ font-family:'Oswald',system-ui,sans-serif; letter-spacing:0.02em; }
  .mono{ font-family:'Roboto Mono',monospace; font-variant-numeric:tabular-nums; }

  /* ---------- header ---------- */
  header{
    padding:22px 16px 14px;
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--pitch-dark) 70%, rgba(13,31,23,0));
    backdrop-filter:blur(6px);
  }
  .title-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .crest{
    width:42px; height:42px; object-fit:contain; flex-shrink:0;
    filter:drop-shadow(0 0 6px rgba(220,183,82,0.25));
  }
  .brand-text{ min-width:0; }
  .title{
    font-size:17px; font-weight:700; text-transform:uppercase;
    color:var(--text); letter-spacing:0.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .subtitle{
    font-size:10px; color:var(--gold-dim); text-transform:uppercase; letter-spacing:0.12em; margin-top:1px;
  }
  .sync-pill{
    font-size:10px; color:var(--text-faint); display:flex; align-items:center; gap:5px;
    padding:4px 9px; border:1px solid var(--line); border-radius:20px;
  }
  .sync-pill.saving{ color:var(--gold); border-color:var(--gold-dim); }
  .sync-pill .led{ width:6px; height:6px; border-radius:50%; background:var(--text-faint); }
  .sync-pill.saving .led{ background:var(--gold); animation:pulse 0.9s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  .month-nav{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--pitch-card); border:1px solid var(--line); border-radius:14px;
    padding:10px 6px; margin-bottom:14px;
  }
  .month-nav button{
    background:none; border:none; color:var(--gold); font-size:20px; padding:6px 16px;
    cursor:pointer; line-height:1;
  }
  .month-label{ font-family:'Oswald'; font-size:16px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; }

  .scoreboard{
    display:flex; gap:10px; margin-bottom:6px;
  }
  .score-box{
    flex:1; background:var(--pitch-card); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px;
  }
  .score-box .label{ font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-faint); margin-bottom:4px; }
  .score-box .value{ font-size:24px; font-weight:700; color:var(--gold); }
  .score-box .value.small{ font-size:15px; color:var(--text); }

  /* ---------- search ---------- */
  .search-wrap{ padding:2px 16px 10px; }
  .search{
    width:100%; padding:11px 14px; border-radius:12px; border:1px solid var(--line);
    background:var(--pitch-card); color:var(--text); font-size:14px; font-family:inherit;
  }
  .search::placeholder{ color:var(--text-faint); }

  /* ---------- squad management ---------- */
  .squad-toggle{
    font-size:11px; color:var(--gold-dim); text-decoration:underline; cursor:pointer;
    margin-top:8px; text-align:right;
  }
  .squad-panel{
    display:none; margin:10px 16px 14px; background:var(--pitch-card); border:1px solid var(--line);
    border-radius:14px; padding:14px;
  }
  .squad-panel.show{ display:block; }
  .squad-add-row{ display:flex; gap:8px; margin-bottom:12px; }
  .squad-input{
    flex:1; padding:9px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--pitch-dark); color:var(--text); font-size:13px; font-family:inherit;
  }
  .squad-input::placeholder{ color:var(--text-faint); }
  .squad-add-btn{
    background:var(--gold); border:none; color:var(--pitch-dark); font-weight:700;
    padding:0 18px; border-radius:10px; font-size:13px; cursor:pointer;
  }
  .squad-chip-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .squad-chip{
    display:flex; align-items:center; gap:7px; background:var(--pitch-dark);
    border:1px solid var(--line); border-radius:20px; padding:6px 8px 6px 12px; font-size:12.5px;
  }
  .squad-chip .remove{
    width:18px; height:18px; border-radius:50%; background:var(--pitch-card-2); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; flex-shrink:0;
  }
  .squad-chip .remove:hover{ background:var(--red-card); color:#fff; }
  .squad-empty{ font-size:12px; color:var(--text-faint); }

  /* ---------- player list ---------- */
  .player-list{ padding:0 16px; display:flex; flex-direction:column; gap:8px; }

  .player-card{
    background:var(--pitch-card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; transition:border-color 0.15s;
  }
  .player-card.open{ border-color:var(--gold-dim); }

  .player-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; cursor:pointer;
  }
  .player-name-wrap{ display:flex; align-items:center; gap:10px; min-width:0; }
  .avatar{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg, var(--pitch-card-2), var(--pitch-dark));
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:'Oswald'; font-size:13px; font-weight:600; color:var(--gold-dim);
  }
  .player-name{ font-size:14.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player-meta{ font-size:11px; color:var(--text-faint); margin-top:1px; }
  .player-total{ font-size:17px; font-weight:700; color:var(--text); flex-shrink:0; padding-left:8px; }
  .player-total.owes{ color:var(--gold); }
  .chevron{ margin-left:8px; color:var(--text-faint); transition:transform 0.2s; font-size:11px; }
  .player-card.open .chevron{ transform:rotate(180deg); }

  .player-detail{ max-height:0; overflow:hidden; transition:max-height 0.25s ease; }
  .player-card.open .player-detail{ max-height:2000px; }
  .detail-inner{ padding:0 14px 16px; border-top:1px solid var(--line); }

  .fine-grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-top:12px;
  }
  .fine-chip{
    background:var(--pitch-dark); border:1px solid var(--line); border-radius:10px;
    padding:9px 10px; display:flex; flex-direction:column; gap:4px;
    cursor:pointer; user-select:none; position:relative;
    transition:transform 0.08s, border-color 0.15s;
  }
  .fine-chip:active{ transform:scale(0.96); }
  .fine-chip.has-count{ border-color:var(--gold-dim); background:rgba(220,183,82,0.08); }
  .fine-chip.card-yellow{ border-left:4px solid var(--yellow-card); }
  .fine-chip.card-red{ border-left:4px solid var(--red-card); }
  .fine-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .fine-label{ font-size:11.5px; line-height:1.25; color:var(--text); }
  .fine-price{ font-size:10px; color:var(--text-faint); font-family:'Roboto Mono'; flex-shrink:0; }
  .fine-bottom{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
  .fine-count{ font-family:'Roboto Mono'; font-size:15px; font-weight:700; color:var(--gold); }
  .fine-count.zero{ color:var(--text-faint); font-weight:500; }
  .fine-minus{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--line);
    background:var(--pitch-card); color:var(--text-dim); font-size:14px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }

  .adj-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
  }
  .adj-row label{ font-size:12px; color:var(--text-dim); }
  .adj-row .hint{ font-size:10px; color:var(--text-faint); display:block; margin-top:1px; }
  .adj-input{
    width:80px; background:var(--pitch-dark); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:7px 8px; font-family:'Roboto Mono'; font-size:13px; text-align:right;
  }

  footer{ padding:22px 16px 6px; text-align:center; }
  footer .rules-link{ font-size:11px; color:var(--text-faint); text-decoration:underline; cursor:pointer; }

  .empty{ text-align:center; padding:30px 10px; color:var(--text-faint); font-size:13px; }

  .toast{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(20px);
    background:var(--pitch-card-2); border:1px solid var(--gold-dim); color:var(--text);
    padding:9px 16px; border-radius:20px; font-size:12.5px; opacity:0; pointer-events:none;
    transition:all 0.25s; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .rules-panel{
    margin:0 16px 14px; background:var(--pitch-card); border:1px solid var(--line);
    border-radius:14px; padding:14px 16px; font-size:12px; color:var(--text-dim); line-height:1.6;
    display:none;
  }
  .rules-panel.show{ display:block; }
  .rules-panel b{ color:var(--text); }
</style>
</head>

  let lastSavedJson = "";

  function monthKey(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
  }
  function monthDocRef(mk){ return db.collection("teamFines").doc(mk); }
  function rosterDocRef(){ return db.collection("teamFines").doc("roster"); }
  function initials(name){
    return name.split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase();
  }
  function money(n){
    return "£" + (Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits: n%1===0?0:2});
  }
  function emptyPlayerData(){ return { counts:{}, adj:0 }; }

  function playerTotal(pd){
    if(!pd) return 0;
    let t = 0;
    for(const f of FINES){ t += (pd.counts[f.id]||0) * f.price; }
    t += Number(pd.adj)||0;
    return t;
  }

  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove("show"), 1600);
  }

  function setSyncState(state){
    const pill = document.getElementById("syncPill");
    const txt = document.getElementById("syncText");
    if(state==="saving"){ pill.classList.add("saving"); txt.textContent = "saving…"; }
    else if(state==="error"){ pill.classList.remove("saving"); txt.textContent = "offline"; }
    else { pill.classList.remove("saving"); txt.textContent = "synced"; }
  }

  function subscribeMonth(){
    if(unsubscribe){ unsubscribe(); unsubscribe = null; }
    setSyncState("saving");
    unsubscribe = monthDocRef(currentMonthKey).onSnapshot(
      snap => {
        const remote = snap.exists ? (snap.data().players || {}) : {};
        const remoteJson = JSON.stringify(remote);
        if(!isDirty && remoteJson !== JSON.stringify(data)){
          data = remote;
          lastSavedJson = remoteJson;
          render();
        }
        setSyncState("idle");
      },
      err => {
        setSyncState("error");
        showToast("Couldn't connect — check your Firebase setup");
      }
    );
  }

  function subscribeRoster(){
    unsubscribeRoster = rosterDocRef().onSnapshot(
      snap => {
        if(snap.exists && Array.isArray(snap.data().players) && snap.data().players.length){
          roster = snap.data().players.slice();
        } else {
          // first run ever — seed Firestore with the default squad
          roster = DEFAULT_PLAYERS.slice();
          rosterDocRef().set({ players: roster });
        }
        roster.sort((a,b)=>a.localeCompare(b));
        render();
        renderSquadPanel();
      },
      err => { showToast("Couldn't load squad list"); }
    );
  }

  function saveRoster(next){
    roster = next.slice().sort((a,b)=>a.localeCompare(b));
    rosterDocRef().set({ players: roster }).catch(()=>{
      showToast("Couldn't save squad — check connection");
    });
  }

  function addPlayer(rawName){
    const name = rawName.trim();
    if(!name) return;
    if(roster.some(p => p.toLowerCase() === name.toLowerCase())){
      showToast(name + " is already on the squad");
      return;
    }
    saveRoster([...roster, name]);
    showToast(name + " added");
  }

  function removePlayer(name){
    const total = playerTotal(data[name]);
    const warn = total > 0
      ? `Remove ${name} from the squad? They still have ${money(total)} logged this month — it stays on record, they just won't show up to add new fines.`
      : `Remove ${name} from the squad?`;
    if(!confirm(warn)) return;
    saveRoster(roster.filter(p => p !== name));
    showToast(name + " removed");
  }

  // Players to actually show: the current roster, plus anyone no longer on
  // the roster who still has a nonzero total this month (so they don't
  // disappear mid-month if removed by mistake).
  function getDisplayedPlayers(){
    const names = new Set(roster);
    Object.keys(data).forEach(n => { if(playerTotal(data[n]) > 0) names.add(n); });
    return Array.from(names).sort((a,b)=>a.localeCompare(b));
  }

  async function saveMonth(){
    const json = JSON.stringify(data);
    if(json === lastSavedJson){ isDirty = false; return; }
    setSyncState("saving");
    try{
      await monthDocRef(currentMonthKey).set({
        players: data,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      lastSavedJson = json;
      isDirty = false;
      setSyncState("idle");
    }catch(e){
      setSyncState("error");
      showToast("Couldn't save — check connection");
    }
  }

  function queueSave(){
    isDirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveMonth, 500);
  }

  function changeMonth(delta){
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth()+delta, 1);
    currentMonthKey = monthKey(currentDate);
    openPlayer = null;
    data = {};
    lastSavedJson = "{}";
    render();
    subscribeMonth();
  }

  function bumpFine(playerName, fineId, delta){
    if(!data[playerName]) data[playerName] = emptyPlayerData();
    const cur = data[playerName].counts[fineId] || 0;
    const next = Math.max(0, cur + delta);
    data[playerName].counts[fineId] = next;
    queueSave();
    renderPlayerList();
  }

  function setAdj(playerName, value){
    if(!data[playerName]) data[playerName] = emptyPlayerData();
    data[playerName].adj = Number(value)||0;
    queueSave();
    renderPlayerList();
  }

  function grandTotal(){
    let t = 0;
    for(const name of getDisplayedPlayers()){ t += playerTotal(data[name]); }
    return t;
  }

  function topPlayerLabel(){
    let best = null, bestVal = 0;
    for(const name of getDisplayedPlayers()){
      const v = playerTotal(data[name]);
      if(v > bestVal){ bestVal = v; best = name; }
    }
    return best ? (best + " — " + money(bestVal)) : "No fines yet";
  }

  function renderHeader(){
    document.getElementById("monthLabel").textContent =
      MONTH_NAMES[currentDate.getMonth()] + " " + currentDate.getFullYear();
    document.getElementById("totalDue").textContent = money(grandTotal());
    document.getElementById("topPlayer").textContent = topPlayerLabel();
  }

  function fineChipHtml(name, fine){
    const pd = data[name];
    const count = pd ? (pd.counts[fine.id]||0) : 0;
    const cardClass = fine.card ? (" card-" + fine.card) : "";
    return `
      <div class="fine-chip ${count>0?'has-count':''}${cardClass}" data-fine="${fine.id}" data-player="${encodeURIComponent(name)}">
        <div class="fine-top">
          <div class="fine-label">${fine.label}</div>
          <div class="fine-price mono">£${fine.price}</div>
        </div>
        <div class="fine-bottom">
          <div class="fine-count ${count===0?'zero':''} mono">${count}</div>
          ${count>0 ? `<div class="fine-minus" data-minus="${fine.id}" data-player="${encodeURIComponent(name)}">−</div>` : `<div></div>`}
        </div>
      </div>`;
  }

  function playerCardHtml(name){
    const pd = data[name];
    const total = playerTotal(pd);
    const isOpen = openPlayer === name;
    const adjVal = pd ? (pd.adj||0) : 0;

    const chips = FINES.map(f => fineChipHtml(name, f)).join("");

    return `
      <div class="player-card ${isOpen?'open':''}" data-player-card="${encodeURIComponent(name)}">
        <div class="player-row" data-toggle="${encodeURIComponent(name)}">
          <div class="player-name-wrap">
            <div class="avatar">${initials(name)}</div>
            <div>
              <div class="player-name">${name}</div>
              <div class="player-meta">${total>0 ? 'owes so far' : 'clean sheet'}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;">
            <div class="player-total ${total>0?'owes':''} mono">${money(total)}</div>
            <div class="chevron">▼</div>
          </div>
        </div>
        <div class="player-detail">
          <div class="detail-inner">
            <div class="fine-grid">${chips}</div>
            <div class="adj-row">
              <div>
                <label>Manual adjustment</label>
                <span class="hint">e.g. no money = fine doubles</span>
              </div>
              <input class="adj-input mono" type="number" step="0.5" value="${adjVal}" data-adj="${encodeURIComponent(name)}" />
            </div>
          </div>
        </div>
      </div>`;
  }

  function renderPlayerList(){
    const q = document.getElementById("search").value.trim().toLowerCase();
    const list = document.getElementById("playerList");
    const names = getDisplayedPlayers().filter(n => n.toLowerCase().includes(q));
    if(names.length === 0){
      list.innerHTML = `<div class="empty">No player matches “${q}”.</div>`;
    } else {
      list.innerHTML = names.map(playerCardHtml).join("");
    }
    renderHeader();
    attachListHandlers();
  }

  function attachListHandlers(){
    document.querySelectorAll("[data-toggle]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const name = decodeURIComponent(el.getAttribute("data-toggle"));
        openPlayer = (openPlayer === name) ? null : name;
        renderPlayerList();
      });
    });
    document.querySelectorAll(".fine-chip").forEach(el=>{
      el.addEventListener("click", (e)=>{
        if(e.target.closest("[data-minus]")) return;
        const name = decodeURIComponent(el.getAttribute("data-player"));
        const fineId = el.getAttribute("data-fine");
        bumpFine(name, fineId, 1);
      });
    });
    document.querySelectorAll("[data-minus]").forEach(el=>{
      el.addEventListener("click", (e)=>{
        e.stopPropagation();
        const name = decodeURIComponent(el.getAttribute("data-player"));
        const fineId = el.getAttribute("data-minus");
        bumpFine(name, fineId, -1);
      });
    });
    document.querySelectorAll("[data-adj]").forEach(el=>{
      el.addEventListener("click", e=>e.stopPropagation());
      el.addEventListener("change", (e)=>{
        const name = decodeURIComponent(el.getAttribute("data-adj"));
        setAdj(name, e.target.value);
      });
    });
  }

  function render(){
    renderPlayerList();
  }

  function renderSquadPanel(){
    const list = document.getElementById("squadChipList");
    if(!list) return;
    if(roster.length === 0){
      list.innerHTML = `<div class="squad-empty">No players yet — add your first one above.</div>`;
    } else {
      list.innerHTML = roster.map(name => `
        <div class="squad-chip">
          <span>${name}</span>
          <span class="remove" data-remove="${encodeURIComponent(name)}">✕</span>
        </div>
      `).join("");
    }
    list.querySelectorAll("[data-remove]").forEach(el=>{
      el.addEventListener("click", ()=>{
        removePlayer(decodeURIComponent(el.getAttribute("data-remove")));
      });
    });
  }

  function renderRules(){
    const panel = document.getElementById("rulesPanel");
    panel.innerHTML = `
      <b>How this works</b><br>
      Tap a player to open their card, then tap a fine to add one tally. Tap the − to remove one.
      Everyone on the team sees the same list — it saves automatically as you go.<br><br>
      <b>Yellow card</b> is doubled to £6 for dissent — use the separate "dissent" chip for those.<br>
      <b>Missing gear</b> and <b>Late</b> are priced per unit — tap once per item missing / per 5 minutes late.<br>
      <b>No money</b> to pay when a fine is due doubles it — add the extra as a manual adjustment on that player.<br>
      New month starts with a clean sheet for everyone automatically.
    `;
  }

  document.getElementById("prevMonth").addEventListener("click", ()=>changeMonth(-1));
  document.getElementById("nextMonth").addEventListener("click", ()=>changeMonth(1));
  document.getElementById("search").addEventListener("input", renderPlayerList);
  document.getElementById("rulesToggle").addEventListener("click", ()=>{
    document.getElementById("rulesPanel").classList.toggle("show");
  });
  document.getElementById("squadToggle").addEventListener("click", ()=>{
    document.getElementById("squadPanel").classList.toggle("show");
  });
  document.getElementById("addPlayerBtn").addEventListener("click", ()=>{
    const input = document.getElementById("newPlayerInput");
    addPlayer(input.value);
    input.value = "";
    input.focus();
  });
  document.getElementById("newPlayerInput").addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){
      document.getElementById("addPlayerBtn").click();
    }
  });

  renderRules();
  render();
  subscribeMonth();
  subscribeRoster();

})();
</script>

</body>
</html>
